name: Update Intel

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: |
          pip install feedparser beautifulsoup4 requests

      - name: Run Scraper
        run: |
          mkdir -p data
          python scrapers/collector.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend deps
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Prepare Deployment Directory
        run: |
          mkdir -p dist/data
          # Frontendのビルド成果物をルートのdistへ
          cp -r frontend/dist/* dist/
          # スクレイピングしたデータをdist/dataへ
          cp data/intel.json dist/data/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
